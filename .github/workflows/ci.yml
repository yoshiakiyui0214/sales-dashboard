name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - run: npx next build --no-lint || true
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test

  deploy:
    # test ジョブが成功したときだけ実行
    needs: test
    # main への push のときだけ本番デプロイ（プルリクエストでは実行しない）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 本番デプロイが同時に2つ走らないようにする
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # 本番のページが実際に開けるかを確認する（最大5回、10秒おきに再試行）
      - name: Smoke test production
        run: |
          BASE_URL="https://sales-dashboard-my-team051.vercel.app"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          for path in /dashboard /upload; do
            ok=false
            for i in 1 2 3 4 5; do
              status=$(curl -s -A "$UA" -D headers.txt -o page.html -w "%{http_code}" "$BASE_URL$path")
              if [ "$status" = "200" ] && grep -q "売上" page.html && ! grep -q "データの取得に失敗" page.html; then
                echo "OK: $path (status=$status)"
                ok=true
                break
              fi
              echo "Retry $i: $path (status=$status)"
              # 転送先と、判断材料になるヘッダーを表示する
              grep -iE "^(location|server|x-vercel-[a-z-]+):" headers.txt || true
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "::error::本番の $path が正しく表示されません (status=$status)"
              exit 1
            fi
          done